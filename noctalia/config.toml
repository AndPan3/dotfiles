[bar.default]
capsule = true
enabled = false
end = [
    "group:musicbar",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_weight = 700
padding = 76
scale = 1.3999999999999999
thickness = 45
widget_spacing = 10

    [[bar.default.capsule_group]]
    border = "outline"
    enabled = true
    fill = "surface_variant"
    foreground = "on_surface"
    id = "musicbar"
    members = [ "music-media", "music-vis", "music-controls" ]
    opacity = 0.68000000000000005
    padding = 4.0
    radius = 10.0
    widget_spacing = 2.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 64.0
    box_width = 96.0
    cx = 816.0
    cy = 540.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 64.0
    box_width = 96.0
    cx = 1008.0
    cy = 540.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend", "idle-behavior" ]

    [idle.behavior.idle-behavior]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1000.0

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
address = "Zofingen"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "andrej/musicbar" ]

[shell]
settings_show_advanced = false

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "ch-de"

    [shell.launcher.providers.calculator]
    prefix = "CACL"

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[wallpaper.default]
path = "/home/andrej/Pictures/Wallpapers/00dbffb7-9b11-4671-a960-adc6f20a2fa9-3860800095.jpg"

[wallpaper.last]
path = "/home/andrej/Pictures/Wallpapers/00dbffb7-9b11-4671-a960-adc6f20a2fa9-3860800095.jpg"

[wallpaper.monitors.DP-1]
path = "/home/andrej/Pictures/Wallpapers/00dbffb7-9b11-4671-a960-adc6f20a2fa9-3860800095.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/andrej/Pictures/Wallpapers/00dbffb7-9b11-4671-a960-adc6f20a2fa9-3860800095.jpg"

[weather]
refresh_minutes = 5

[widget.music-controls]
capsule = false
type = "andrej/musicbar:controls"

    [widget.music-controls.actions]
    right = "panel-toggle control-center media"
    scroll_down = "volume-down"
    scroll_up = "volume-up"

[widget.music-media]
art_size = 24
capsule = false
hide_artist = true
hide_when_no_media = true
max_length = 190
min_length = 90
title_scroll = "always"
type = "media"

    [widget.music-media.actions]
    back = "media previous"
    forward = "media next"
    left = "panel-toggle control-center media"
    right = "panel-toggle control-center media"
    scroll_down = "volume-down"
    scroll_up = "volume-up"

[widget.music-vis]
bands = 10
capsule = false
centered = true
color_1 = "primary"
color_2 = "secondary"
mirrored = false
show_when_idle = false
type = "audio_visualizer"
width = 54

    [widget.music-vis.actions]
    left = "panel-toggle control-center media"
    right = "media toggle"
    scroll_down = "volume-down"
    scroll_up = "volume-up"
